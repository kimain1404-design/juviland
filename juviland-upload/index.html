<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>쥬비랜드 섹션 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#f3f4f6; --bar:#ffffff; --text:#1f1f1f; --muted:#6b7280; --line:#dedede;
    --brand:#082548; --brand-text:#ffffff; --accent:#b4633b; --ok:#1e6b64;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--bar:#1f2227;--text:#e9eaec;--muted:#9aa0a8;--line:#33373e;--brand:#e9eaec;--brand-text:#14161a}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{background:var(--bg);color:var(--text);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;word-break:keep-all}

  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px clamp(16px,4vw,40px);background:var(--bar);border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
  .top h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.02em}
  .top h1 small{margin-left:6px;font-size:13px;font-weight:500;color:var(--muted)}
  .toc{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
  .toc a{display:block;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:13px;font-weight:600;text-decoration:none}
  .toc a:hover{border-color:var(--text)}
  .switch{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .switch input{width:16px;height:16px;accent-color:var(--accent)}

  .sec-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px clamp(16px,4vw,40px);background:var(--bar);border-top:1px solid var(--line);border-bottom:1px solid var(--line);scroll-margin-top:72px}
  .sec-no{padding:3px 8px;border-radius:6px;background:var(--brand);color:var(--brand-text);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .sec-name{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .sec-path{font-size:13px;color:var(--muted)}
  .sec-actions{margin-left:auto;display:flex;gap:6px}
  .btn{font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--text)}
  .btn.done{border-color:var(--ok);color:var(--ok)}
  .btn:focus-visible,.toc a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* 라이브클래스와 같은 폭·높이 계산식으로 표시 (음수 마진만 제외) */
  .frame{display:block;width:100vw;max-width:100vw;border:0;background:#fff}

  body.seamless .sec-bar{display:none}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>

<header class="top">
  <h1>쥬비랜드 섹션 관리 <small id="count"></small></h1>
  <ul class="toc" id="toc"></ul>
  <label class="switch"><input type="checkbox" id="seamless"> 실제 페이지처럼 이어 보기</label>
</header>

<main id="list"></main>

<script>
/* =========================================================
   섹션 목록 — 새 섹션을 만들면 여기에 한 줄만 추가하세요.
   path   : 저장소 안 폴더 이름 (끝에 / 포함)
   height : 라이브클래스 iframe height 계산식 (각 폴더 liveklass-embed.html 과 동일)
   ========================================================= */
var BASE = 'https://kimain1404-design.github.io/juviland/';
var SECTIONS = [
  {
    no: '01', name: '히어로 · 글로벌 농업 인재 경력패스', path: 'juvi-hero/',
    title: '쥬비랜드 글로벌 농업 인재 경력패스',
    height: 'calc(min(46.35vw, 741.6px) + clamp(0px, calc(min(1200px - 100vw, 100vw - 767px) * 10000), calc(211.2px - 10.89vw)) + clamp(0px, calc((768px - 100vw) * 10000), calc(min(100.05vw, 540.3px) - 46.35vw)))'
  },
  {
    no: '02', name: 'WHY ZUVILAND · 연결 문장', path: 'juvi-why/',
    title: '쥬비랜드 왜 농업 인재의 여정을 끝까지 연결해야 할까요',
    height: 'calc(min(270.05vw + 7px, 1815px) - clamp(0px, (100vw - 1023.5px) * 10000, min(270.05vw + 7px, 1815px) - min(69.29vw + 5px, 892px)))'
  }
  // , { no: '03', name: '섹션 이름', path: 'juvi-xxx/', title: 'iframe 제목', height: '높이 계산식' }
];

function embedCode(s){
  return '<p>\n  <iframe src="' + BASE + s.path + '" title="' + s.title + '" scrolling="no" style="display:block;width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);margin-top:-50px;margin-bottom:-50px;border:0;height:' + s.height + ';"></iframe>\n</p>';
}

function copyText(text){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise(function(res, rej){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy') ? res() : rej(); } catch(e){ rej(e); }
    document.body.removeChild(ta);
  });
}

var list = document.getElementById('list'), toc = document.getElementById('toc');
document.getElementById('count').textContent = '섹션 ' + SECTIONS.length + '개';
if (!SECTIONS.length) list.innerHTML = '<p class="empty">등록된 섹션이 없습니다. index.html 의 SECTIONS 목록에 섹션을 추가하세요.</p>';

SECTIONS.forEach(function(s){
  var id = 's' + s.no;

  var li = document.createElement('li');
  li.innerHTML = '<a href="#' + id + '">' + s.no + '</a>';
  toc.appendChild(li);

  var bar = document.createElement('div');
  bar.className = 'sec-bar'; bar.id = id;
  bar.innerHTML =
    '<span class="sec-no">section ' + s.no + '</span>' +
    '<span class="sec-name"></span>' +
    '<span class="sec-path">/' + s.path + '</span>' +
    '<span class="sec-actions">' +
      '<a class="btn" href="./' + s.path + '" target="_blank" rel="noopener">새 탭에서 열기</a>' +
      '<button type="button" class="btn" data-copy>라이브클래스 코드 복사</button>' +
    '</span>';
  bar.querySelector('.sec-name').textContent = s.name;

  var btn = bar.querySelector('[data-copy]');
  btn.addEventListener('click', function(){
    copyText(embedCode(s)).then(function(){
      btn.textContent = '복사했습니다'; btn.classList.add('done');
      setTimeout(function(){ btn.textContent = '라이브클래스 코드 복사'; btn.classList.remove('done'); }, 1800);
    }, function(){ btn.textContent = '복사 실패 · 폴더의 liveklass-embed.html 사용'; });
  });

  var f = document.createElement('iframe');
  f.className = 'frame'; f.src = './' + s.path; f.title = s.title;
  f.setAttribute('scrolling', 'no'); f.loading = 'lazy';
  f.style.height = s.height;

  list.appendChild(bar); list.appendChild(f);
});

var sw = document.getElementById('seamless');
sw.addEventListener('change', function(){ document.body.classList.toggle('seamless', sw.checked); });
</script>
</body>
</html>
