<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>쥬비랜드 | 문의 바로가기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="./qa-section02.css">
</head>
<body>

<!-- qa-section02(pc) 3열 카드 / qa-section02(mob) 세로 3줄 카드 -->
<nav class="qa" aria-label="문의 바로가기">
  <div class="qa__inner">
    <a class="sc reveal" href="https://zuviland.liveklass.com/forms/cfBSdTVSrAgpXcufGgXf" target="_blank" rel="noopener">
      <span class="sc__tile sc__tile--base"><img src="./assets/qa-section02-icon-message.png" alt="" width="148" height="148"></span>
      <span class="sc__text">
        <strong class="sc__title">지자체 상담 신청</strong>
        <span class="sc__desc">지역 맞춤 인재 운영, 지금 상담해 보세요</span>
      </span>
      <span class="sc__arrow" aria-hidden="true"><i></i></span>
    </a>
    <a class="sc reveal" href="https://zuviland.liveklass.com/forms/rZFHNFGr3zg7F7dBjXGt" target="_blank" rel="noopener">
      <span class="sc__tile sc__tile--warm"><img src="./assets/qa-section02-icon-handshake.png" alt="" width="148" height="148"></span>
      <span class="sc__text">
        <strong class="sc__title">투자 및 협력 문의</strong>
        <span class="sc__desc">쥬비랜드와 함께할 파트너를 기다립니다</span>
      </span>
      <span class="sc__arrow" aria-hidden="true"><i></i></span>
    </a>
    <a class="sc sc--en reveal" href="https://zuviland.liveklass.com/forms/RvXQDsnTrhmqVzvscG4Y" target="_blank" rel="noopener" lang="en">
      <span class="sc__tile sc__tile--nature"><img src="./assets/qa-section02-icon-globe.png" alt="" width="148" height="148"></span>
      <span class="sc__text">
        <strong class="sc__title">Investment or Partner with Us</strong>
        <span class="sc__desc">Global investors and partners welcome</span>
      </span>
      <span class="sc__arrow" aria-hidden="true"><i></i></span>
    </a>
  </div>
</nav>

<script src="./qa-section02.js" defer></script>
</body>
</html>
